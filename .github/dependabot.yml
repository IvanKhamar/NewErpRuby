version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    groups:
      gems:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only, so a TypeScript 7 bump cannot install (npm ERESOLVE).
      # Remove this when typescript-eslint supports 7 (DECISIONS.md D19).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
